[project]
name = "path-sam"
version = "0.1.0"
description = "Segment Anything (micro-sam) along a drawn PATH, in 3D"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkitekt[all]>=10.0",
    "mikro>=12.1.0",
    "micro-sam>=1.8.14",
    "fabriks>=1.3.1",
    "dask[array]>=2026.8.0",
    "xarray>=2026.9.0",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "pandas>=2.2",
    # micro-sam would otherwise pull numcodecs back to 0.15, under zarr 3.
    "numcodecs>=0.16.5",
]

[project.optional-dependencies]
cpu = ["torch>=2.5", "torchvision"]
# PyPI's own torch is the CUDA 13 build: it brings its CUDA runtime and needs a host driver >= 580.
cu130 = ["torch>=2.5", "torchvision"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "konstruktor>=0.34.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"
markers = ["hub: needs a hub made for the tests (Docker and konstruktor)"]

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false
